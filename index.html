<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <!-- Supabase Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App JavaScript -->
    <script src="script.js"></script>
</body>
</html>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Becules • Last-Minute ISC Physics Prep</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        teal: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 dark:bg-[#090d16] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200 antialiased">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 w-full bg-white/90 dark:bg-[#0c1220]/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/80 transition-colors">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <!-- Brand Logo -->
                <div class="flex items-center space-x-3 cursor-pointer select-none" onclick="navigateTo('home')">
                    <span class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
                        Becules<span class="text-teal-600 dark:text-teal-400">.</span>
                    </span>
                    <span class="text-[10px] font-bold tracking-wider uppercase px-2 py-0.5 rounded bg-teal-50 dark:bg-teal-950 text-teal-700 dark:text-teal-300 border border-teal-200/60 dark:border-teal-800">
                        Physics Hub
                    </span>
                </div>

                <!-- Desktop Nav -->
                <nav class="hidden md:flex items-center space-x-8">
                    <button id="nav-home" onclick="navigateTo('home')" class="text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-teal-600 dark:hover:text-teal-400 transition">Home</button>
                    <button id="nav-resources" onclick="navigateTo('resources')" class="text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-teal-600 dark:hover:text-teal-400 transition">Study & Practice</button>
                    <button id="nav-about" onclick="navigateTo('about')" class="text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-teal-600 dark:hover:text-teal-400 transition">About Us</button>
                    <button id="nav-contribute" onclick="navigateTo('contribute')" class="text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-teal-600 dark:hover:text-teal-400 transition">Contribute</button>
                    
                    <!-- Theme Toggle Button -->
                    <button onclick="toggleTheme()" class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Theme" aria-label="Toggle Theme">
                        <i id="theme-icon" class="fa-solid fa-moon text-base"></i>
                    </button>
                </nav>

                <!-- Mobile Action Controls -->
                <div class="md:hidden flex items-center space-x-2">
                    <button onclick="toggleTheme()" class="p-2 text-slate-600 dark:text-slate-300">
                        <i id="mobile-theme-icon" class="fa-solid fa-moon"></i>
                    </button>
                    <button onclick="toggleMobileMenu()" class="p-2 text-slate-600 dark:text-slate-300">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-[#0c1220] px-4 pt-3 pb-5 space-y-2">
            <button onclick="navigateTo('home'); toggleMobileMenu()" class="block w-full text-left py-2 text-sm font-semibold text-slate-700 dark:text-slate-200">Home</button>
            <button onclick="navigateTo('resources'); toggleMobileMenu()" class="block w-full text-left py-2 text-sm font-semibold text-slate-700 dark:text-slate-200">Study & Practice</button>
            <button onclick="navigateTo('about'); toggleMobileMenu()" class="block w-full text-left py-2 text-sm font-semibold text-slate-700 dark:text-slate-200">About Us</button>
            <button onclick="navigateTo('contribute'); toggleMobileMenu()" class="block w-full text-left py-2 text-sm font-semibold text-slate-700 dark:text-slate-200">Contribute</button>
        </div>
    </header>

    <!-- Main Dynamic Content Region -->
    <main id="main-content" class="flex-grow">
        <!-- Rendered by script.js -->
    </main>

    <!-- Floating Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center space-x-2 transition-all">
        <span id="toast-message">Notification</span>
    </div>

    <!-- Minimal Clean Footer -->
    <footer class="border-t border-slate-200/80 dark:border-slate-800 bg-white dark:bg-[#0c1220] py-8 transition-colors">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">
                Becules • Built for Last-Minute Revision by students of Ida Scudder School (Batch of 2028)
            </p>
            <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1">Open-Source • Free Forever • No Ads</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
